<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">阅读布局：宽屏双列与窄屏单列重排</title><desc id="desc">宽屏采用 Grid 双列（左侧 sticky 目录 + 右侧 minmax(0,1fr) 正文）；窄屏收拢为单列，顶部目录可折叠，代码块与表格在局部横向滚动。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d8075"/></marker></defs>
<rect width="1200" height="680" rx="20" fill="#fffdf7"/>
<g font-family="system-ui, sans-serif" fill="#233a32">
<text x="40" y="58" font-size="32" text-anchor="start" font-weight="700" fill="#233a32">阅读布局：宽屏双列与窄屏单列重排</text>
<text x="415" y="111" font-size="28" text-anchor="middle" font-weight="700" fill="#233a32">宽屏：212px + minmax(0, 1fr)</text>
<text x="995" y="111" font-size="28" text-anchor="middle" font-weight="700" fill="#233a32">窄屏：单列折叠</text>
<rect x="40" y="140" width="750" height="425" rx="12" fill="#eef4ef" stroke="#6d8075" stroke-width="2"/>
<rect x="65" y="165" width="175" height="370" rx="12" fill="#fffdf7" stroke="#6d8075" stroke-width="2"/>
<rect x="265" y="165" width="500" height="370" rx="12" fill="#fffdf7" stroke="#6d8075" stroke-width="2"/>
<text x="152" y="213" font-size="25" text-anchor="middle" font-weight="700" fill="#233a32">目录 (sticky)</text>
<text x="152" y="253" font-size="22" text-anchor="middle" font-weight="400" fill="#4c5c54">随滚动高亮</text>
<text x="515" y="209" font-size="27" text-anchor="middle" font-weight="700" fill="#233a32">article：正文列</text>
<text x="515" y="253" font-size="25" text-anchor="middle" font-weight="400" fill="#233a32">min-width: 0 允许列收缩</text>
<text x="515" y="294" font-size="25" text-anchor="middle" font-weight="400" fill="#233a32">控制单行字数与行高</text>
<g>
<rect x="290" y="330" width="450" height="100" rx="12" fill="#eef4ef" stroke="#6d8075" stroke-width="2"/>
<text x="515" y="370" font-size="24" text-anchor="middle" font-weight="700" fill="#233a32">长代码块与宽数据表</text>
<text x="515" y="406" font-size="24" text-anchor="middle" font-weight="400" fill="#233a32">overflow-x: auto 局部横向滚动</text>
</g>
<path d="M 335 470 L 690 470" fill="none" stroke="#6d8075" stroke-width="3" marker-end="url(#arrow)"/>
<text x="515" y="512" font-size="24" text-anchor="middle" font-weight="400" fill="#4c5c54">不撑破外层视口</text>
<g>
<rect x="835" y="140" width="325" height="115" rx="12" fill="#eef4ef" stroke="#6d8075" stroke-width="2"/>
<text x="997.5" y="187" font-size="25" text-anchor="middle" font-weight="700" fill="#233a32">目录：默认收起</text>
<text x="997.5" y="225" font-size="23" text-anchor="middle" font-weight="400" fill="#233a32">按需展开跳转</text>
</g>
<path d="M 997 260 L 997 278" fill="none" stroke="#6d8075" stroke-width="3" marker-end="url(#arrow)"/>
<g>
<rect x="835" y="285" width="325" height="280" rx="12" fill="#fffdf7" stroke="#6d8075" stroke-width="2"/>
<text x="997.5" y="375" font-size="26" text-anchor="middle" font-weight="700" fill="#233a32">article：正文</text>
<text x="997.5" y="415" font-size="24" text-anchor="middle" font-weight="400" fill="#233a32">段落自适应换行</text>
<text x="997.5" y="455" font-size="24" text-anchor="middle" font-weight="400" fill="#233a32">代码与表格局部滚动</text>
</g>
<text x="600" y="622" font-size="26" text-anchor="middle" font-weight="400" fill="#233a32">同一套 DOM 在宽屏分列、窄屏单列，外层页面始终无横向滚动条</text>
</g>
</svg>
