<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">材质分层：实色纸面与单一玻璃层</title>
<desc id="desc">背景画布、浅色遮罩、实色正文纸面和顶栏玻璃依次分层。正文、卡片与页脚使用实色纸面；玻璃只出现在顶栏与播放器悬浮控件，弹层使用实色表面。</desc>
<rect width="1200" height="620" fill="#f9f8f3"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#202b23">
  <text x="48" y="62" font-size="48" font-weight="600">材质分层：实色纸面 + 单一玻璃层</text>
  <text x="48" y="94" font-size="26" fill="#4b574b">背景可以看见，长文不依赖透明度，玻璃只服务悬浮层。</text>

  <g transform="translate(48 126)">
    <rect x="0" y="52" width="720" height="330" rx="14" fill="#dfe6da"/>
    <text x="24" y="80" font-size="22" font-weight="600" fill="#334a2b">1 · 画布背景</text>
    <text x="24" y="102" font-size="18" fill="#4b574b">本地 WebP · cover</text>

    <rect x="0" y="52" width="720" height="330" rx="14" fill="rgba(243,244,237,0.38)"/>
    <text x="24" y="128" font-size="22" font-weight="600" fill="#334a2b">2 · 浅色遮罩</text>
    <text x="24" y="150" font-size="18" fill="#4b574b">只统一明暗，不承载文字</text>

    <rect x="24" y="174" width="672" height="184" rx="12" fill="#fffefa" stroke="#c9d0c5"/>
    <rect x="48" y="198" width="300" height="12" rx="6" fill="#202b23"/>
    <rect x="48" y="226" width="560" height="8" rx="4" fill="#dde3d9"/>
    <rect x="48" y="244" width="520" height="8" rx="4" fill="#dde3d9"/>
    <rect x="48" y="262" width="540" height="8" rx="4" fill="#dde3d9"/>
    <rect x="48" y="292" width="240" height="42" rx="8" fill="#eef1e8"/>
    <text x="168" y="317" font-size="18" text-anchor="middle" fill="#3f5a36">实色正文纸面</text>

    <rect x="24" y="8" width="672" height="44" rx="10" fill="#fffefa" stroke="#c9d0c5"/>
    <text x="360" y="36" font-size="22" font-weight="600" text-anchor="middle" fill="#334a2b">玻璃顶栏 · 唯一常驻模糊层</text>
  </g>

  <g transform="translate(816 126)">
    <rect x="0" y="0" width="336" height="164" rx="14" fill="#eef1e8"/>
    <text x="20" y="30" font-size="23" font-weight="600" fill="#334a2b">配色是独立选择</text>
    <rect x="20" y="48" width="134" height="44" rx="8" fill="#fffefa" stroke="#c9d0c5"/>
    <text x="87" y="75" font-size="19" text-anchor="middle">浅色</text>
    <rect x="166" y="48" width="150" height="44" rx="8" fill="#181f17" stroke="#3a4639"/>
    <text x="241" y="75" font-size="19" text-anchor="middle" fill="#e3e9de">深色</text>
    <text x="20" y="124" font-size="18" fill="#4b574b">画布与配色互不重置</text>
    <text x="20" y="146" font-size="18" fill="#4b574b">透明度只改浮层底色</text>

    <rect x="0" y="188" width="336" height="194" rx="14" fill="#eef1e8"/>
    <text x="20" y="218" font-size="23" font-weight="600" fill="#334a2b">玻璃预算</text>
    <rect x="20" y="236" width="296" height="36" rx="8" fill="#fffefa" stroke="#c9d0c5"/>
    <text x="168" y="259" font-size="19" text-anchor="middle">顶栏 · 1</text>
    <rect x="20" y="280" width="296" height="36" rx="8" fill="#fffefa" stroke="#c9d0c5"/>
    <text x="168" y="303" font-size="19" text-anchor="middle">播放器悬浮控件 · 1</text>
    <text x="20" y="342" font-size="18" fill="#4b574b">弹层与卡片使用实色表面</text>
    <text x="20" y="364" font-size="18" fill="#4b574b">不在玻璃容器里再套玻璃卡片</text>
  </g>

  <rect x="48" y="516" width="1104" height="66" rx="12" fill="#e4ebdd"/>
  <text x="600" y="544" font-size="23" font-weight="600" text-anchor="middle" fill="#334a2b">回退顺序：正常玻璃 → 系统减少透明度 → 不支持滤镜 → 强制颜色</text>
  <text x="600" y="566" font-size="18" text-anchor="middle" fill="#4b574b">实色纸面始终可用，不依赖任何滤镜能力。</text>
</g>
</svg>
