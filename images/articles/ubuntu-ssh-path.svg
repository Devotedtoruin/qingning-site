<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">SSH：连接入口与验证链</title><desc id="desc">客户端经 socket 或 service 监听到服务器；配置检查、监听检查、网络规则与新会话逐层验证。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d8075"/></marker></defs>
<rect width="1200" height="560" rx="20" fill="#fffdf7"/>
<g font-family="system-ui, sans-serif" fill="#233a32">
<text x="40" y="58" font-size="32" text-anchor="start" font-weight="700" fill="#233a32">SSH：连接入口与验证链</text>
<g>
<rect x="40" y="175" width="255" height="135" rx="12" fill="#eef4ef" stroke="#6d8075" stroke-width="2"/>
<text x="167.5" y="232.34" font-size="26" text-anchor="middle" font-weight="700" fill="#233a32">本地 SSH 客户端</text>
<text x="167.5" y="270.34000000000003" font-size="26" text-anchor="middle" font-weight="400" fill="#233a32">公钥与独立新会话</text>
</g>
<g>
<rect x="400" y="110" width="320" height="105" rx="12" fill="#eef4ef" stroke="#6d8075" stroke-width="2"/>
<text x="560.0" y="152.34" font-size="26" text-anchor="middle" font-weight="700" fill="#233a32">ssh.socket</text>
<text x="560.0" y="190.34" font-size="26" text-anchor="middle" font-weight="400" fill="#233a32">ListenStream 控制监听</text>
</g>
<g>
<rect x="400" y="270" width="320" height="105" rx="12" fill="#eef4ef" stroke="#6d8075" stroke-width="2"/>
<text x="560.0" y="312.34" font-size="26" text-anchor="middle" font-weight="700" fill="#233a32">ssh.service</text>
<text x="560.0" y="350.34" font-size="26" text-anchor="middle" font-weight="400" fill="#233a32">Port / ListenAddress</text>
</g>
<g>
<rect x="865" y="175" width="295" height="135" rx="12" fill="#eef4ef" stroke="#6d8075" stroke-width="2"/>
<text x="1012.5" y="232.34" font-size="26" text-anchor="middle" font-weight="700" fill="#233a32">Ubuntu 服务器</text>
<text x="1012.5" y="270.34000000000003" font-size="26" text-anchor="middle" font-weight="400" fill="#233a32">账号、认证与 sudo</text>
</g>
