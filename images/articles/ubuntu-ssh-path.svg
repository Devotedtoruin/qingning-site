<path d="M 720 162 L 785 162 L 785 220 L 853 220" fill="none" stroke="#6d8075" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 720 322 L 785 322 L 785 265 L 853 265" fill="none" stroke="#6d8075" stroke-width="3" marker-end="url(#arrow)"/>
<text x="560" y="86" font-size="24" text-anchor="middle" font-weight="400" fill="#4c5c54">按实际监听单元二选一</text>
