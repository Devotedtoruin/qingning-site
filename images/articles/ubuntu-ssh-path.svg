<text x="157.5" y="496.16" font-size="24" text-anchor="middle" font-weight="400" fill="#233a32">sshd -t / -T</text>
</g>
<g>
<rect x="335" y="425" width="235" height="90" rx="12" fill="#f4edda" stroke="#6d8075" stroke-width="2"/>
